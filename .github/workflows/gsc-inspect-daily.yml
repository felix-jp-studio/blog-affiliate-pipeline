name: GSC inspect daily

# Daily URL inspection: GSC UI indexing request + URL Inspection API + queue commit.
# Requires GSC_SERVICE_ACCOUNT_JSON (+ GSC_PLAYWRIGHT_STORAGE_STATE for UI requests).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max URLs per run"
        required: false
        default: "10"
      api_only:
        description: "Skip Playwright UI (API status check only)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/trigger-gsc-inspect"
  schedule:
    # 09:00 JST = UTC 00:00
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  inspect-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chrome
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.api_only }}
        run: npx playwright install --with-deps chrome

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: GSC access preflight
        id: preflight
        continue-on-error: true
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
        run: |
          node scripts/gsc/verify-access.mjs | tee /tmp/gsc-preflight.log

      - name: GSC UI session preflight
        id: ui_preflight
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.api_only }}
        continue-on-error: true
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_PLAYWRIGHT_STORAGE_STATE: ${{ secrets.GSC_PLAYWRIGHT_STORAGE_STATE }}
          GSC_PLAYWRIGHT_HEADLESS: "true"
        run: |
          node scripts/gsc/verify-ui-session.mjs | tee /tmp/gsc-ui-preflight.log

      - name: Run GSC inspect batch
        id: inspect
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_PLAYWRIGHT_STORAGE_STATE: ${{ secrets.GSC_PLAYWRIGHT_STORAGE_STATE }}
          GSC_PLAYWRIGHT_HEADLESS: "true"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIMIT="${{ inputs.limit || '10' }}"
            API_ONLY="${{ inputs.api_only }}"
          else
            LIMIT="3"
            API_ONLY="false"
          fi
          ARGS=(--week-first --limit="$LIMIT" --write-note --commit)
          if [ "$API_ONLY" = "true" ]; then
            ARGS+=(--api-only)
          fi
          node scripts/gsc/inspect-batch.mjs "${ARGS[@]}" | tee /tmp/gsc-inspect.log

      - name: Push queue commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST_MSG=$(git log -1 --pretty=%B)
          if ! echo "$LAST_MSG" | grep -q 'chore(gsc): daily inspect batch'; then
            echo "No GSC batch commit to push."
            exit 0
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload ops report (push fallback)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-inspect-report
          path: docs/operations/gsc-inspect-run-*.md
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## GSC inspect daily"
            echo ""
            echo "- script: \`scripts/gsc/inspect-batch.mjs\`"
            echo "- queue: \`data/gsc-index-queue.json\`"
            echo "- docs: \`docs/gsc-inspect-automation.md\`"
            echo "- setup: \`docs/operations/gsc-parallel-setup.md\`"
            echo ""
            if [ -f /tmp/gsc-ui-preflight.log ]; then
              echo "### UI preflight (verify-ui-session)"
              echo '```'
              cat /tmp/gsc-ui-preflight.log
              echo '```'
              echo ""
            fi
            if [ -f /tmp/gsc-preflight.log ]; then
              echo "### Preflight (verify-access)"
              echo '```'
              cat /tmp/gsc-preflight.log
              echo '```'
              echo ""
            fi
            if [ -f /tmp/gsc-inspect.log ]; then
              echo "### Log"
              echo '```'
              tail -n 40 /tmp/gsc-inspect.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-inspect-screenshots
          path: docs/operations/gsc-inspect-screenshots/
          if-no-files-found: ignore
