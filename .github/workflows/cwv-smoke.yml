name: CWV smoke (Lighthouse)

on:
  workflow_dispatch:
  schedule:
    # Sun 11:00 JST = UTC Sun 02:00
    - cron: "0 2 * * 0"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Initial rollout: scores can fluctuate on production CDN; do not block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run Lighthouse CI smoke
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## CWV smoke (Lighthouse CI)"
            echo ""
            echo "- formFactor: **mobile**"
            echo "- targets (3): \`/\` · \`/sim\` · \`/articles/sim-osusume-hikaku-2026\`"
            echo "- config: \`lighthouserc.cjs\`"
            echo "- thresholds (warn): performance ≥0.6, a11y/BP ≥0.85, SEO ≥0.9, LCP ≤4000ms, CLS ≤0.15, TBT ≤600ms"
            echo "- policy: \`continue-on-error: true\` / asserts remain **warn** until baseline stabilizes"
            echo "- baseline log: \`docs/operations/cwv-baseline.md\`"
            echo "- docs: \`docs/cwv-smoke.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
