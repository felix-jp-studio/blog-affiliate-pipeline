name: Affiliate sync agent cycle

# Manual / labeled issue / workflow_dispatch → plan sync + create agent Issue.
on:
  repository_dispatch:
    types: [affiliate-sync]
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  agent-cycle:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'affiliate-sync-auto')
    runs-on: ubuntu-latest
    concurrency:
      group: affiliate-sync-agent-cycle
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Health check and plan sync
        id: plan
        run: |
          node scripts/affiliate/link-health-check.mjs || true
          node scripts/affiliate/plan-sync-cycle.mjs | tee /tmp/plan-out.txt
          ACTION=$(head -1 /tmp/plan-out.txt | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).action))")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Create agent issue
        if: steps.plan.outputs.action == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/affiliate/create-affiliate-agent-issue.mjs
