name: GSC weekly report

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Generate sample report from fixture rows (no API)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/trigger-gsc-weekly-report"
  schedule:
    # Mon 09:00 JST = UTC Mon 00:00
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  gsc-weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check secrets presence (no values logged)
        id: creds
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
        run: |
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "mode=service-account" >> "$GITHUB_OUTPUT"
          elif [ -n "$GSC_OAUTH_CLIENT_ID" ] && [ -n "$GSC_OAUTH_CLIENT_SECRET" ] && [ -n "$GSC_OAUTH_REFRESH_TOKEN" ]; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
          else
            echo "mode=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Run weekly report
        id: report
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GSC_SITE_URL:-}" ]; then
            export GSC_SITE_URL="${{ vars.GSC_SITE_URL }}"
          fi
          if [ -z "${GSC_SITE_URL:-}" ]; then
            export GSC_SITE_URL="https://sim-hikari-guide.com/"
          fi

          if [ "${{ inputs.fixture }}" = "true" ]; then
            node scripts/gsc-weekly-report.mjs --fixture --dry-run | tee /tmp/gsc-weekly-out.txt
          elif [ "${{ steps.creds.outputs.mode }}" = "missing" ]; then
            echo "## GSC weekly report" >> "$GITHUB_STEP_SUMMARY"
            echo "Secrets missing — graceful skip (exit 0)." >> "$GITHUB_STEP_SUMMARY"
            echo "Configure GSC_SERVICE_ACCOUNT_JSON or GSC_OAUTH_* (see docs/secrets.md)." >> "$GITHUB_STEP_SUMMARY"
            node scripts/gsc-weekly-report.mjs --dry-run | tee /tmp/gsc-weekly-out.txt
            exit 0
          else
            node scripts/gsc-weekly-report.mjs | tee /tmp/gsc-weekly-out.txt
            END=$(node --input-type=module -e "import { weekRange } from './scripts/gsc/search-analytics.mjs'; console.log(weekRange().endDate.replaceAll('-',''))")
            CSV="data/gsc-performance-${END}.csv"
            if [ -f "$CSV" ]; then
              node scripts/gsc-import-rewrite-queue.mjs --csv="$CSV" | tee -a /tmp/gsc-weekly-out.txt
            fi
          fi

      - name: Commit report
        if: >
          github.ref == 'refs/heads/main' &&
          steps.creds.outputs.mode != 'missing' &&
          github.event.inputs.fixture != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gsc-weekly/ data/rewrite-queue.csv
          if ls data/gsc-performance-*.csv >/dev/null 2>&1; then
            git add data/gsc-performance-*.csv
          fi
          if git diff --staged --quiet; then
            echo "No weekly report changes to commit."
            exit 0
          fi
          git commit -m "chore(gsc): weekly search analytics report"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Job summary
        if: always()
        run: |
          {
            echo "## GSC weekly report"
            echo ""
            echo "Credential mode: \`${{ steps.creds.outputs.mode }}\`"
            echo ""
            if [ -f /tmp/gsc-weekly-out.txt ]; then
              echo '```'
              cat /tmp/gsc-weekly-out.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
