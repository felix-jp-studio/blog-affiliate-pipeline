name: Rewrite weekly

on:
  workflow_dispatch:
  schedule:
    # Mon 10:00 JST = UTC Mon 01:00
    - cron: "0 1 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    concurrency:
      group: rewrite-weekly
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run rewrite queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rewrite-weekly.mjs --create-pr

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Rewrite weekly"
            echo ""
            echo "- queue: \`data/rewrite-queue.csv\`"
            echo "- script: \`node scripts/rewrite-weekly.mjs --create-pr\`"
            echo "- empty queue: exits 0 (no failure)"
            echo "- docs: \`docs/rewrite-weekly-workflow.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
