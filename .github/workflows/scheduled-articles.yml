name: Scheduled articles

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when not a scheduled day"
        type: boolean
        default: false
  schedule:
    # Sun-Sat 09:00 JST = UTC Sun-Sat 00:00 (7 articles/week: Mon-Sat types + Sun crosssell)
    - cron: "0 0 * * 0-6"

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    concurrency:
      group: scheduled-articles
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run scheduled publish
        run: |
          BEFORE="$(git status --porcelain)"
          PYTHONPATH=packages/generator python3 -m generator publish-scheduled --dry-run --force
          AFTER="$(git status --porcelain)"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "Dry-run modified working tree unexpectedly"
            git status --short
            exit 1
          fi

      - name: Generate scheduled articles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          npm run publish:scheduled -- $FORCE_FLAG

      - name: Format
        if: success()
        run: |
          npm run format
          cd site && npm ci && npm run format

      - name: Validate
        if: success()
        run: |
          npm run format:check
          npm test
          npm run test:generator
          node scripts/e2e/validate-articles.mjs
          cd site && npm ci && npm run format:check && npm run build
          node ../scripts/e2e/validate-dist.mjs

      - name: Check for article publish changes
        id: changes
        run: |
          CHANGED=$(git status --porcelain -- site/src/content/articles state/publish-queue.json)
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No article or publish-queue changes; skipping publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$CHANGED"
          fi

      - name: Install Playwright browsers
        if: success() && steps.changes.outputs.changed == 'true'
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Update Playwright visual snapshots
        if: success() && steps.changes.outputs.changed == 'true'
        working-directory: site
        env:
          CI: true
          PUBLIC_CONTACT_FORM_ACTION: ""
        run: |
          npm run test:e2e:visual:update
          npm run test:e2e:visual

      - name: Resolve publish slugs
        if: success() && steps.changes.outputs.changed == 'true'
        id: publish_slugs
        run: |
          SLUGS="$(
            git status --porcelain -- site/src/content/articles \
              | awk '{print $2}' \
              | sed 's|.*/||;s|\.md||' \
              | paste -sd,
          )"
          echo "slugs=${SLUGS}" >> "$GITHUB_OUTPUT"
          echo "Publish slugs: ${SLUGS:-<none>}"

      - name: Commit and push to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          RUN_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/content/articles state/publish-queue.json
          git add site/tests/visual/*-snapshots/
          if git diff --cached --quiet; then
            echo "No staged article changes; skipping push."
            exit 0
          fi
          git commit -m "chore: scheduled articles ${RUN_DATE}"
          git push origin main

      # GITHUB_TOKEN pushes do not trigger other workflows on push.
      # Run post-publish scripts inline (same as indexnow-ping.yml / post-publish-index-queue.yml).
      - name: Ping IndexNow (post-publish)
        if: steps.changes.outputs.changed == 'true' && steps.publish_slugs.outputs.slugs != ''
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_SLUGS: ${{ steps.publish_slugs.outputs.slugs }}
        run: |
          node scripts/e2e/verify-indexnow-key.mjs --target=production
          node scripts/indexnow-ping.mjs

      - name: Update GSC index queue (post-publish)
        if: steps.changes.outputs.changed == 'true' && steps.publish_slugs.outputs.slugs != ''
        run: node scripts/append-index-queue.mjs --slugs=${{ steps.publish_slugs.outputs.slugs }}

      - name: Commit GSC index queue
        if: steps.changes.outputs.changed == 'true' && steps.publish_slugs.outputs.slugs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gsc-index-queue.json
          if git diff --cached --quiet; then
            echo "No queue changes to commit."
            exit 0
          fi
          git commit -m "chore: update GSC index queue after scheduled publish"
          git push origin main

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Scheduled articles"
            echo ""
            echo "- changed: ${{ steps.changes.outputs.changed }}"
            echo "- publish: direct push to \`main\` (no PR; validate + visual in this job)"
            echo "- follow-up: IndexNow ping + GSC queue in this job (GITHUB_TOKEN push does not trigger other workflows); PR merges still use \`post-publish-index-queue.yml\` / \`indexnow-ping.yml\`"
            echo "- schedule: Sun-Sat 09:00 JST (7/week = Mon-Sat comparison×2 / howto×2 / troubleshoot×2 + Sun crosssell)"
            echo "- docs: docs/article-publish-schedule.md"
          } >> "$GITHUB_STEP_SUMMARY"
