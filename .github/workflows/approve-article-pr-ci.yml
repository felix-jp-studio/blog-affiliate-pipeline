name: Approve article PR CI

# github-actions[bot] PR では CI が action_required になり auto-merge が止まる。
# pull_request_target + PAT で base コンテキストから pending run を approve する
# （この workflow 自身が action_required になるデッドロックを避ける）。

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  actions: write
  pull-requests: read
  contents: read

jobs:
  approve-pending-runs:
    if: >-
      github.event.pull_request.draft == false &&
      (
        contains(github.event.pull_request.labels.*.name, 'article-publish') ||
        startsWith(github.event.pull_request.head.ref, 'scheduled/articles-')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Approve action_required workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_BOT_TOKEN != '' && secrets.GITHUB_BOT_TOKEN || github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${{ secrets.GITHUB_BOT_TOKEN }}" ]; then
            echo "Warning: GITHUB_BOT_TOKEN is not set; approve may fail for bot PRs."
          fi
          bash scripts/approve-pending-runs.sh "${HEAD_SHA}" "${REPO}"
