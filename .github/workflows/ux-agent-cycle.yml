name: UX agent cycle

on:
  repository_dispatch:
    types: [ux-pdca]
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent-cycle:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ux-pdca-auto')
    runs-on: ubuntu-latest
    concurrency:
      group: ux-agent-cycle
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect metrics and plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/ux-pdca/collect-ux-metrics.mjs --update-state
          node scripts/ux-pdca/plan-ux-cycle.mjs

      - name: Create agent issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ux-pdca/create-ux-agent-issue.mjs
