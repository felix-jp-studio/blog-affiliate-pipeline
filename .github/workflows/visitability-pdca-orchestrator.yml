name: Visitability PDCA orchestrator

# Check → Plan → Act for Visitability Cycles (Tue/Fri 09:00 JST).
on:
  schedule:
    - cron: "0 0 * * 2"
    - cron: "0 0 * * 5"
  workflow_dispatch:
    inputs:
      skip_run:
        description: "Plan only (skip run-cycle and PR)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: visitability-pdca-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Check — collect metrics
        run: node scripts/visitability/collect-metrics.mjs --update-state

      - name: Plan — next cycle brief
        id: plan
        run: |
          set +e
          node scripts/visitability/plan-cycle.mjs
          CODE=$?
          set -e
          if [ "$CODE" -eq 3 ]; then
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" -eq 2 ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" -ne 0 ]; then
            exit "$CODE"
          fi
          CYCLE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/visitability-cycle-brief.json','utf8')).cycleNumber)")
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"

      - name: Create escalation issue
        if: steps.plan.outputs.escalate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Visitability PDCA: plan escalation required" \
            --label "visitability-cycle-auto" \
            --body "$(cat <<EOF
          ## Plan escalation

          \`plan-cycle.mjs\` could not produce a cycle brief automatically.

          - Workflow: \`${{ github.workflow }}\` run \`${{ github.run_id }}\`
          - State: \`config/visitability-pdca-state.json\`
          - Action: review blockers, adjust keywords, or run Cycle manually.

          \`\`\`json
          $(cat config/visitability-pdca-state.json)
          \`\`\`
          EOF
          )" || true

      - name: Stop when paused or plan-only
        if: >
          steps.plan.outputs.paused == 'true' ||
          inputs.skip_run == true ||
          steps.plan.outputs.cycle == ''
        run: echo "Skipping Act phase."

      - name: Act — run cycle on branch
        if: >
          steps.plan.outputs.paused != 'true' &&
          inputs.skip_run != true &&
          steps.plan.outputs.cycle != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CYCLE="${{ steps.plan.outputs.cycle }}"
          BRANCH="feature/visitability-cycle${CYCLE}-auto"
          REPO="${{ github.repository }}"

          EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            EXISTING=$(gh pr list --repo "$REPO" --state open --label "visitability-cycle-auto" --json number,title | jq --arg c "$CYCLE" '[.[] | select(.title == ("Visitability Cycle " + $c))][0].number // empty')
          fi
          if [ -n "$EXISTING" ]; then
            echo "Open PR #${EXISTING} already exists for cycle ${CYCLE}; skipping Act."
            exit 0
          fi
          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            echo "Remote branch ${BRANCH} exists without an open PR; skipping Act to avoid push conflict."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          node scripts/visitability/run-cycle.mjs
          git add \
            config/ \
            data/ \
            site/src/content/articles/ \
            site/src/data/hub-article-mesh.ts \
            state/ || true
          git diff --staged --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Visitability Cycle ${CYCLE} (PDCA auto)"
          git push -u origin "$BRANCH"
          gh pr create \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base main \
            --title "Visitability Cycle ${CYCLE}" \
            --label "visitability-cycle-auto" \
            --body "$(cat <<EOF
          ## Visitability Cycle ${CYCLE} (PDCA auto)

          Automated Check → Plan → Act cycle.

          - Brief: \`data/visitability-cycle-brief.json\`
          - Gatekeeper: Pass → merge / Fail → close

          ## Test plan
          - [ ] CI validate
          - [ ] playwright-visual (if site changed)
          EOF
          )"

      - name: Sync roadmap (best effort)
        if: >
          steps.plan.outputs.paused != 'true' &&
          inputs.skip_run != true &&
          steps.plan.outputs.cycle != ''
        run: node scripts/visitability/sync-roadmap-progress.mjs --cycle=${{ steps.plan.outputs.cycle }} || true
