name: Visitability PDCA orchestrator

# Check → Plan → Act for Visitability (V2 multi-act).
on:
  schedule:
    - cron: "0 0 * * 2"
    - cron: "0 0 * * 5"
  workflow_dispatch:
    inputs:
      skip_run:
        description: "Plan only (skip Act)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: visitability-pdca-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Check — collect metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/visitability/collect-metrics.mjs --update-state

      - name: Plan — visitability act
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/visitability/plan-visitability-act.mjs
          CODE=$?
          set -e
          if [ "$CODE" -eq 3 ]; then
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" -eq 2 ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" -ne 0 ]; then
            exit "$CODE"
          fi
          ACT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/visitability-act-brief.json','utf8')).actType)")
          CYCLE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/visitability-act-brief.json','utf8')).cycleNumber)")
          echo "actType=$ACT" >> "$GITHUB_OUTPUT"
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"

      - name: Create escalation issue
        if: steps.plan.outputs.escalate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Visitability PDCA: plan escalation required" \
            --label "visitability-cycle-auto" \
            --body "See config/visitability-pdca-state.json" || true

      - name: Stop when paused or plan-only
        if: >
          steps.plan.outputs.paused == 'true' ||
          inputs.skip_run == true ||
          steps.plan.outputs.cycle == ''
        run: echo "Skipping Act phase."

      - name: Act — agent issue only
        if: >
          steps.plan.outputs.paused != 'true' &&
          inputs.skip_run != true &&
          steps.plan.outputs.actType == 'meta_ctr_agent'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/visitability/create-visitability-agent-issue.mjs

      - name: Act — run act and open PR
        if: >
          steps.plan.outputs.paused != 'true' &&
          inputs.skip_run != true &&
          steps.plan.outputs.actType != '' &&
          steps.plan.outputs.actType != 'meta_ctr_agent'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CYCLE="${{ steps.plan.outputs.cycle }}"
          ACT="${{ steps.plan.outputs.actType }}"
          BRANCH="feature/visitability-cycle${CYCLE}-${ACT}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          node scripts/visitability/run-act.mjs
          git add config/ data/ docs/operations/ site/ state/ || true
          git diff --staged --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Visitability Cycle ${CYCLE} (${ACT})"
          git push -u origin "$BRANCH"
          gh pr create \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base main \
            --title "Visitability Cycle ${CYCLE} (${ACT})" \
            --label "visitability-cycle-auto" \
            --body "$(cat <<EOF
          ## Visitability PDCA Cycle ${CYCLE}

          - Act type: \`${ACT}\`
          - Brief: \`data/visitability-act-brief.json\`
          - Gatekeeper: Pass → merge / Fail → close
          EOF
          )"

      - name: Sync roadmap (best effort)
        if: >
          steps.plan.outputs.paused != 'true' &&
          inputs.skip_run != true &&
          steps.plan.outputs.actType == 'article_cycle'
        run: node scripts/visitability/sync-roadmap-progress.mjs --cycle=${{ steps.plan.outputs.cycle }} || true
